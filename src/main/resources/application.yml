        bid-price: "Bid Unit Price單位價格"
        offer-currency: "Offer Price Currency賣出單位貨幣"
        offer-price: "Offer Price單位價格"

# Centralized masking policy (email/mobile/identity/date-of-birth destination
# masking and generic logging redaction). See MaskingService for the contract.
masking:
  email:
    enabled: true
    mode: variable-length
    mask-length: 4
    mask-character: "*"
  mobile:
    enabled: true
    mode: variable-length
    mask-length: 4
    mask-character: "*"
  identity:
    enabled: true
    mask-character: "*"
  date-of-birth:
    enabled: true
    placeholder: "<redacted>"
  logging:
    enabled: true
    mask-character: "*"
    placeholder: "***"
    sensitive-tokens:
      - password
      - clientSecret
      - client_secret
      - clientId
      - client_id
      - apiKey
      - apikey
      - token
      - secret
      - policyNo
      - policy_no
      - policy-no
      - certificate
      - cert
      - authorization
      - certNo
      - userId
      - privateKey
      - publicKey
      - cert-no
      - user-id
  disabled-placeholder: "<masked>"
