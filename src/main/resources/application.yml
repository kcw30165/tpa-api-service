server:
  port: ${SERVER_PORT:8888}

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: ngtpa-api-server
  cloud:
    config:
      enabled: ${SPRING_CLOUD_CONFIG_ENABLED:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# Set to false when authentication is enforced externally (K8s ingress / API gateway).
# Override via env var: API_SECURITY_REQUIRE_AUTHENTICATION=false
# Default is true so local dev and CI always require auth unless explicitly opted out.
api:
  security:
    require-authentication: ${API_SECURITY_REQUIRE_AUTHENTICATION:true}

reference-date:
  deployment-env: ${DEPLOY_ENV:}
  override-date: ${REFERENCE_DATE_OVERRIDE_DATE:}
  override-zone-id: ${REFERENCE_DATE_OVERRIDE_ZONE_ID:}

apim:
  baseUrl: ${APIM_BASEURL:}
  timeoutMilliseconds: ${APIM_TIMEOUTMILLISECONDS:10000}
  oauth:
    registrationId: ${APIM_CLIENT_REGISTRATION_ID:apim-client}
    clientId: ${APIM_CLIENT_ID:local-dev}
    clientSecret: ${APIM_CLIENT_SECRET:local-dev}
    clientAuthenticationMethod: ${APIM_CLIENT_AUTH_METHOD:client_secret_basic}
    tokenUri: ${APIM_TOKEN_URI:http://localhost/token}
    scope: ${APIM_CLIENT_SCOPE:}
  encryption:
    enabled: ${APIM_ENCRYPTION_ENABLED:true}
    certificatePath: ${APIM_CERTIFICATE_PATH:/api/wssupport/v1/encryption/certificate}
    apiKey: ${APIM_API_KEY:}
    privateKeyPem: ${APIM_PRIVATE_KEY_PEM:}
    publicKeyPem: ${APIM_PUBLIC_KEY_PEM:}
    requestFields:
      - policy-no
      - cert-no
      - user-id

request-logging:
  enabled: true
  log-headers: false
  header-allowlist:
    - User-Agent
    - Accept
    - Content-Type
  body-logging:
    # Body logging is DISABLED by default. Request/response bodies may contain PII
    # or sensitive business data. Enable only in local or lower environments.
    # Never enable broadly in production or production-like environments.
    # To enable locally, override in application-local.yml for specific endpoints only.
    enabled: false
    default-max-body-size-bytes: 4096
    endpoints: []

logging:
  level:
    org.springframework.security: DEBUG
    com.bct.ngtpa: DEBUG

