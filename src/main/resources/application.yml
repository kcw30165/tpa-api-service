redis-cache:
  general-metadata:
    ttl: PT20M
  enabled: ${REDIS_CACHE_ENABLED:true}
  key-prefix: ${REDIS_KEY_PREFIX:ngtpa}
  password: ${REDIS_PASSWORD:}
  timeout-milliseconds: ${REDIS_TIMEOUT_MILLISECONDS:1000}
  sentinel:
    master: ${REDIS_SENTINEL_MASTER:ngtpaMaster}
    nodes: ${REDIS_SENTINEL_NODES:}
    password: ${REDIS_SENTINEL_PASSWORD:}
  ssl:
    enabled: ${REDIS_SSL_ENABLED:true}
    bundle: ${REDIS_SSL_BUNDLE:redis-mtls}
  lettuce:
    pool:
      max-active: ${REDIS_POOL_MAX_ACTIVE:20}
      max-idle: ${REDIS_POOL_MAX_IDLE:10}
      min-idle: ${REDIS_POOL_MIN_IDLE:0}
      max-wait-milliseconds: ${REDIS_POOL_MAX_WAIT_MILLISECONDS:3000}
    shutdown-timeout-milliseconds: ${REDIS_SHUTDOWN_TIMEOUT_MILLISECONDS:5000}

logging:
  level:
    org.springframework.security: INFO
    com.bct.ngtpa: INFO

email:
  enabled: ${EMAIL_ENABLED:true}
  smtp:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:25}
    from: ${SMTP_FROM:}
    timeout-millis: ${SMTP_TIMEOUT_MILLIS:5000}
shared-idempotency:
  username-recovery-start-replay:
    key-version: ${SHARED_IDEMPOTENCY_USERNAME_RECOVERY_START_REPLAY_KEY_VERSION:v1}
    secret: ${SHARED_IDEMPOTENCY_USERNAME_RECOVERY_START_REPLAY_SECRET:}
  enabled: ${SHARED_IDEMPOTENCY_ENABLED:false}
  # Required only when enabled; Base64 and at least 32 decoded bytes.
  persistence-hmac-secret: ${SHARED_IDEMPOTENCY_PERSISTENCE_HMAC_SECRET:}
  registration-start-replay:
    key-version: ${SHARED_IDEMPOTENCY_REGISTRATION_START_REPLAY_KEY_VERSION:}
    secret: ${SHARED_IDEMPOTENCY_REGISTRATION_START_REPLAY_SECRET:}
  forgot-password-start-replay:
    key-version: ${SHARED_IDEMPOTENCY_FORGOT_PASSWORD_START_REPLAY_KEY_VERSION:}
    secret: ${SHARED_IDEMPOTENCY_FORGOT_PASSWORD_START_REPLAY_SECRET:}

