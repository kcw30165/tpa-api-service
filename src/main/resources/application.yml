server:
  port: ${SERVER_PORT:8888}

spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:classpath:application-page-personal-information.yml
      - optional:classpath:application-page-registration.yml
      - optional:classpath:application-registration-errors.yml
  application:
    name: ngtpa-api-server
  ssl:
    bundle:
      pem:
        redis-mtls:
          truststore:
            certificate: file:/etc/redis-tls/ca.crt
          keystore:
            certificate: file:/etc/redis-tls/tls.crt
            private-key: file:/etc/redis-tls/tls.key

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  allowed-headers: ${CORS_ALLOWED_HEADERS:Account-Ref,Accept-Language,X-Request-Id,Content-Type,Authorization}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH}

# Set to false when authentication is enforced externally (K8s ingress / API gateway).
# Override via env var: API_SECURITY_REQUIRE_AUTHENTICATION=false
# Default is true so local dev and CI always require auth unless explicitly opted out.
api:
  security:
    require-authentication: ${API_SECURITY_REQUIRE_AUTHENTICATION:true}

reference-date:
  cache-ttl-seconds: ${REFERENCE_DATE_CACHE_TTL_SECONDS:0}
  refresh:
    cache-ttl-seconds: ${REFERENCE_DATE_REFRESH_CACHE_TTL_SECONDS:86400}

config-service:
  base-url: ${CONFIG_SERVICE_BASE_URL:}
  timeout-milliseconds: ${CONFIG_SERVICE_TIMEOUT_MILLISECONDS:10000}
  username: ${CONFIG_SERVICE_USERNAME:}
  password: ${CONFIG_SERVICE_PASSWORD:}

sms:
  enabled: ${SMS_ENABLED:true}
  base-url: ${SMS_BASE_URL:}
  send-single-path: ${SMS_SEND_SINGLE_PATH:/sms/ext/sendSingleSMS.do}
  username: ${SMS_USERNAME:}
  password: ${SMS_PASSWORD:}
  send-id: ${SMS_SEND_ID:}
  class-code: ${SMS_CLASS_CODE:}
  default-country: ${SMS_DEFAULT_COUNTRY:852}
  timeout-millis: ${SMS_TIMEOUT_MILLIS:5000}

auth-flow-session:
  persistence-schema-version: 2
  session-id:
    prefix: afs
    entropy-bytes: 16
  cookie:
    name: auth_flow_sid
    path: /api/v1/auth
    max-age-seconds: 1800
    http-only: true
    secure: true
    same-site: None
  csrf:
    cookie-name: XSRF-TOKEN
    header-name: X-XSRF-TOKEN
    cookie-path: /api/v1/auth
    max-age-seconds: 1800
    secure: true
    same-site: None
  origin-validation:
    enabled: true
  concurrency:
    mode: SINGLE_ACTIVE_FLOW
    on-new-flow: REPLACE_EXISTING
  scenarios:
    registration:
      enabled: true
      required: true
      ttl-seconds: 1800
    login:
      enabled: true
      required: true
      ttl-seconds: 900
    forgot-password:
      enabled: true
      required: true
      ttl-seconds: 1800
    username-recovery:
      enabled: true
      required: false
      ttl-seconds: 600

# Global account identifier formatting. Not login-specific: policy and
# certificate numbers are padded identically wherever they are rendered.
account-identifiers:
  policy-no:
    width: 11
  cert-no:
    width: 4
  pad-character: "0"

auth-workflows:
  forgot-password:
    message:
      destination-override:
        mobile: ${FORGOT_PASSWORD_MESSAGE_OVERRIDE_MOBILE:}
        email: ${FORGOT_PASSWORD_MESSAGE_OVERRIDE_EMAIL:}
    username:
      min-length: 4
      max-length: 128
      trim: true
      case-insensitive: true
      normalization: ASCII_LOWERCASE
    context-protection:
      enabled: true
      key-version: ${FORGOT_PASSWORD_CONTEXT_KEY_VERSION:}
      secret: ${FORGOT_PASSWORD_CONTEXT_SECRET:}
    allowed-public-identity-types:
      - GPN
      - GPFS
      - STAFF_NO
      - ID
    tas-to-public-identity-type-mapping:
      GPN: GPN
      GPFS: GPFS
      ID: ID
      STAFFNO: STAFF_NO
    otp:
      length: 6
      numeric-only: true
      ttl-seconds: 300
      resend-cooldown-seconds: 60
      max-verify-attempts: 5
      resend-limit-enabled: true
      max-resend-attempts: 5
      invalidate-previous-on-resend: true
      reset-verify-attempts-on-resend: true
      localized-template:
        en:
          sms: "Your BCT forgot password verification code is {code}. It is valid for {ttlValue} {ttlUnit}."
          email-subject: "BCT forgot password verification code"
          email-body: "Your BCT forgot password verification code is {code}. It is valid for {ttlValue} {ttlUnit}."
        zh_HK:
          sms: "您的 BCT 忘記密碼驗證碼為 {code}，有效期限為 {ttlValue} {ttlUnit}。"
          email-subject: "BCT 忘記密碼驗證碼"
          email-body: "您的 BCT 忘記密碼驗證碼為 {code}，有效期限為 {ttlValue} {ttlUnit}。"
    details-and-otp:
      mutation-lock-lease-seconds: ${FORGOT_PASSWORD_DETAILS_OTP_LOCK_LEASE_SECONDS:60}
      mutation-lock-redis-allowance-seconds: ${FORGOT_PASSWORD_DETAILS_OTP_REDIS_ALLOWANCE_SECONDS:10}
      mutation-lock-safety-margin-seconds: ${FORGOT_PASSWORD_DETAILS_OTP_SAFETY_MARGIN_SECONDS:10}
    idempotency:
      start-ttl-seconds: 300
      details-and-otp-ttl-seconds: 300
      otp-resend-ttl-seconds: 300
      otp-verify-ttl-seconds: 300
      complete-ttl-seconds: 300
      cancel-ttl-seconds: 300
    otp-commit:
      expired-replay-grace-seconds: ${FORGOT_PASSWORD_OTP_EXPIRED_REPLAY_GRACE_SECONDS:300}
      maximum-retention-seconds: ${FORGOT_PASSWORD_OTP_COMMIT_MAX_RETENTION_SECONDS:1800}
    reset-authorization:
      ttl-seconds: 300
  login:
    message:
      destination-override:
        mobile: ${LOGIN_MESSAGE_OVERRIDE_MOBILE:}
        email: ${LOGIN_MESSAGE_OVERRIDE_EMAIL:}

    credential:
      username-min-length: ${LOGIN_USERNAME_MIN_LENGTH:1}
      username-max-length: ${LOGIN_USERNAME_MAX_LENGTH:128}
      password-min-length: ${LOGIN_PASSWORD_MIN_LENGTH:1}
      password-max-length: ${LOGIN_PASSWORD_MAX_LENGTH:128}
      username-case-insensitive: true
      username-trim: true
      username-normalization: ASCII_LOWERCASE
      username-allowed-pattern: ${LOGIN_USERNAME_ALLOWED_PATTERN:^[A-Za-z0-9._-]+$}
      password-trim: false
      password-case-sensitive: true
    context-protection:
      enabled: true
      key-version: ${LOGIN_PREAUTH_CONTEXT_KEY_VERSION:}
      secret: ${LOGIN_PREAUTH_CONTEXT_SECRET:}
      destination-id-entropy-bytes: ${LOGIN_DESTINATION_ID_ENTROPY_BYTES:24}
    otp:
      length: ${LOGIN_OTP_LENGTH:6}
      numeric-only: true
      ttl-seconds: ${LOGIN_OTP_TTL_SECONDS:300}
      resend-cooldown-seconds: ${LOGIN_OTP_RESEND_COOLDOWN_SECONDS:60}
      max-verify-attempts: ${LOGIN_OTP_MAX_VERIFY_ATTEMPTS:5}
      resend-limit-enabled: false
      max-resend-attempts: 0
      sms-template: "Your BCT login verification code is {code}. It is valid for {ttlValue} {ttlUnit}."
      email-template:
        subject: "BCT login verification code"
        body: "Your BCT login verification code is {code}. It is valid for {ttlValue} {ttlUnit}."
    idempotency:
      start-ttl-seconds: ${LOGIN_START_IDEMPOTENCY_TTL_SECONDS:300}
      otp-send-ttl-seconds: ${LOGIN_OTP_SEND_IDEMPOTENCY_TTL_SECONDS:300}
      otp-resend-ttl-seconds: ${LOGIN_OTP_RESEND_IDEMPOTENCY_TTL_SECONDS:300}
      otp-verify-ttl-seconds: ${LOGIN_OTP_VERIFY_IDEMPOTENCY_TTL_SECONDS:300}
      cancel-ttl-seconds: ${LOGIN_CANCEL_IDEMPOTENCY_TTL_SECONDS:300}
      persistence-hmac-secret: ${AUTH_WORKFLOWS_LOGIN_IDEMPOTENCY_PERSISTENCE_HMAC_SECRET:}
    # 0061 / 001A-5. Read-only replay never refreshes these TTLs.
    otp-verify-recovery:
      otp-verify-idempotency-ttl-seconds: 600
      authenticated-login-handoff-retention-seconds: 900
      otp-consumption-proof-retention-seconds: 900
      auth-flow-deletion-proof-retention-seconds: 900
      minimum-retention-seconds: 300
      maximum-retention-seconds: 1800
    session:
      absolute-timeout-seconds: ${AUTH_WORKFLOWS_LOGIN_SESSION_ABSOLUTE_TIMEOUT_SECONDS:28800}
      terminal-retention-seconds: ${AUTH_WORKFLOWS_LOGIN_SESSION_TERMINAL_RETENTION_SECONDS:300}
      idle-timeout-seconds: ${AUTH_WORKFLOWS_LOGIN_SESSION_IDLE_TIMEOUT_SECONDS:900}
      cookie:
        name: ${AUTH_WORKFLOWS_LOGIN_SESSION_COOKIE_NAME:portal_sid}
        path: ${AUTH_WORKFLOWS_LOGIN_SESSION_COOKIE_PATH:/api}
        max-age-seconds: ${AUTH_WORKFLOWS_LOGIN_SESSION_COOKIE_MAX_AGE_SECONDS:900}
        http-only: true
        secure: ${AUTH_WORKFLOWS_LOGIN_SESSION_COOKIE_SECURE:true}
        same-site: ${AUTH_WORKFLOWS_LOGIN_SESSION_COOKIE_SAME_SITE:None}
      protection:
        key-version: ${AUTH_WORKFLOWS_LOGIN_SESSION_PROTECTION_KEY_VERSION:}
        base64-key: ${AUTH_WORKFLOWS_LOGIN_SESSION_PROTECTION_BASE64_KEY:}
    account-ref:
      prefix: acc
      entropy-bytes: 24
      max-generation-attempts: 8
  username-recovery:
    session:
      ttl-seconds: 600
    message:
      destination-override:
        mobile: ${USERNAME_RECOVERY_MESSAGE_OVERRIDE_MOBILE:}
        email: ${USERNAME_RECOVERY_MESSAGE_OVERRIDE_EMAIL:}
    template:
      email-subject: ${USERNAME_RECOVERY_EMAIL_SUBJECT:BCT username recovery}
      email-body: ${USERNAME_RECOVERY_EMAIL_BODY:Your BCT username is {username}.}
      sms-body: ${USERNAME_RECOVERY_SMS_BODY:Your BCT username is {username}.}
  registration:
    pre-start-challenge:
      enabled: true
      type: CAPTCHA
    captcha:
      length: 7
      alphabet: "23456789ABCDEFGHJKLMNPQSTUVWXYZ"
      case-sensitive: false
      ttl-seconds: 300
      max-attempts: 5
    message:
      destination-override:
        mobile: ${REGISTRATION_MESSAGE_OVERRIDE_MOBILE:}
        email: ${REGISTRATION_MESSAGE_OVERRIDE_EMAIL:}
    otp:
      length: 6
      numeric-only: true
      ttl-seconds: 300
      resend-cooldown-seconds: 60
      max-verify-attempts: 5
      resend-limit-enabled: true
      max-resend-attempts: 5
      invalidate-previous-on-resend: true
      reset-verify-attempts-on-resend: true
      sms-template: "Your BCT verification code is {code}. It is valid for {ttlValue} {ttlUnit}."
      email-template:
        subject: "BCT verification code"
        body: "Your verification code is {code}. It is valid for {ttlValue} {ttlUnit}."
    username:
      min-length: 4
      max-length: 128
      no-spaces: true
      case-insensitive: true
      required-digit: true
      required-special: false
      allowed-special-chars: "!@#$%^&*()_-"
    password:
      min-length: 8
      max-length: 16
      no-spaces: true
      not-same-as-username-ignore-case: true
      required-categories: 3
      special-chars: "!@#$%^&*()_-"
    idempotency:
      start-ttl-seconds: 300
      otp-resend-ttl-seconds: 300
      otp-verify-ttl-seconds: 300
      complete-ttl-seconds: 300

apim:
  account-balance:
    path: ${APIM_ACCOUNT_BALANCE_PATH:/ws/NGTPA/v1/TRPGetMemberAccBal}
  account-gain-loss:
    path: ${APIM_ACCOUNT_GAIN_LOSS_PATH:/ws/NGTPA/v1/TRPGetInvestGL}
  general-metadata:
    path: ${APIM_GENERAL_METADATA_PATH:/ws/NGTPA/v1/TRPGetGeneralMetaData}
  routing:
    non-account-profile-id: apim-non-account

    account-env-profile-mappings:
      DB: db
      JP: jp
      TB: tb

  credential-profiles:
    profiles:
      - profile-id: apim-non-account
        base-url: ${APIM_BASEURL:}
        token-uri: ${APIM_TOKEN_URI:}
        client-id: ${APIM_NON_ACCOUNT_CLIENT_ID:}
        client-secret: ${APIM_NON_ACCOUNT_CLIENT_SECRET:}
        scope:
          - ${APIM_CLIENT_SCOPE:}
        api-key: ${APIM_NON_ACCOUNT_API_KEY:}
        certificate-path: ${APIM_CERTIFICATE_PATH:}

      - profile-id: db
        base-url: ${APIM_BASEURL:}
        token-uri: ${APIM_TOKEN_URI:}
        client-id: ${APIM_DB_CLIENT_ID:}
        client-secret: ${APIM_DB_CLIENT_SECRET:}
        scope:
          - ${APIM_CLIENT_SCOPE:}
        api-key: ${APIM_DB_API_KEY:}
        certificate-path: ${APIM_CERTIFICATE_PATH:}

      - profile-id: jp
        base-url: ${APIM_BASEURL:}
        token-uri: ${APIM_TOKEN_URI:}
        client-id: ${APIM_JP_CLIENT_ID:}
        client-secret: ${APIM_JP_CLIENT_SECRET:}
        scope:
          - ${APIM_CLIENT_SCOPE:}
        api-key: ${APIM_JP_API_KEY:}
        certificate-path: ${APIM_CERTIFICATE_PATH:}

      - profile-id: tb
        base-url: ${APIM_BASEURL:}
        token-uri: ${APIM_TOKEN_URI:}
        client-id: ${APIM_TB_CLIENT_ID:}
        client-secret: ${APIM_TB_CLIENT_SECRET:}
        scope:
          - ${APIM_CLIENT_SCOPE:}
        api-key: ${APIM_TB_API_KEY:}
        certificate-path: ${APIM_CERTIFICATE_PATH:}

  login:
    get-account-list:
      path: /ws/NGTPA/v1/TRPGetAccountList
      operation-name: TRPGetAccountList
      error-mappings:
        err.tpa.no.active.account: UNAVAILABLE
        err.tpa.no.valid.login.ac: UNAVAILABLE
    member-login:
      path: ${APIM_LOGIN_MEMBER_LOGIN_PATH:/ws/NGTPA/v1/TRPMemberLogin}
      operation-name: ${APIM_LOGIN_MEMBER_LOGIN_OPERATION:TRPMemberLogin}
  retry:
    business-call:
      max-attempts: ${APIM_BUSINESS_RETRY_MAX_ATTEMPTS:3}
      backoff-milliseconds: ${APIM_BUSINESS_RETRY_BACKOFF_MILLISECONDS:100}
  timeout-milliseconds: ${APIM_TIMEOUT_MILLISECONDS:${APIM_TIMEOUTMILLISECONDS:10000}}
  encryption:
    enabled: ${APIM_ENCRYPTION_ENABLED:true}
    certificate-path: ${APIM_CERTIFICATE_PATH:/api/wssupport/v1/encryption/certificate}
    api-key: ${APIM_API_KEY:}
    private-key-pem: ${APIM_PRIVATE_KEY_PEM:}
    public-key-pem: ${APIM_PUBLIC_KEY_PEM:}
    request-fields:
      - policy-no
      - cert-no
      - user-id
      - login-user-id
      - search-value
      - cust-id
      - email
      - mobile-number
    response-fields:
      - policy-no
      - cert-no
      - user-id
      - cust-id
      - email
      - mobile-number

request-logging:
  enabled: true
  log-headers: false
  header-allowlist:
    - User-Agent
    - Accept
    - Content-Type
  body-logging:
    # Body logging is DISABLED by default. Request/response bodies may contain PII
    # or sensitive business data. Enable only in local or lower environments.
    # Never enable broadly in production or production-like environments.
    # To enable locally, override in application-local.yml for specific endpoints only.
    enabled: false
    default-max-body-size-bytes: 4096
    endpoints: []

