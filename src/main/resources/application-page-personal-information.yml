bff-pages:
  pages:
    personalInformation:
      metadata:
        id: personalInformationPage
        version: "1.0"
        title:
          en: "Personal Information"
          zh_HK: "個人資料"
      form:
        id: personalInformationForm
        defaultMode: view
        actions:
          - name: edit
            label:
              en: "Edit"
              zh_HK: "編輯"
          - name: submit
            label:
              en: "Submit"
              zh_HK: "提交"
          - name: reset
            label:
              en: "Reset"
              zh_HK: "重設"
          - name: cancel
            label:
              en: "Cancel"
              zh_HK: "取消"
        sections:
          - id: addressInformation
            title:
              en: "Address Information"
              zh_HK: "地址資料"
            fields:
              - id: residentialAddressLine1
                label:
                  en: "Residential Address Line 1"
                  zh_HK: "居住地址第一行"
              - id: residentialAddressLine2
                label:
                  en: "Residential Address Line 2"
                  zh_HK: "居住地址第二行"
              - id: residentialAddressLine3
                label:
                  en: "Residential Address Line 3"
                  zh_HK: "居住地址第三行"
              - id: residentialCountry
                label:
                  en: "Residential Country"
                  zh_HK: "居住國家"
                optionSource: countries
              - id: mailingAddressSameAsResidential
                label:
                  en: "Mailing address same as residential"
                  zh_HK: "郵寄地址與居住地址相同"
              - id: mailingAddressLine1
                label:
                  en: "Mailing Address Line 1"
                  zh_HK: "郵寄地址第一行"
              - id: mailingAddressLine2
                label:
                  en: "Mailing Address Line 2"
                  zh_HK: "郵寄地址第二行"
              - id: mailingAddressLine3
                label:
                  en: "Mailing Address Line 3"
                  zh_HK: "郵寄地址第三行"
              - id: mailingCountry
                label:
                  en: "Mailing Country"
                  zh_HK: "郵寄國家"
                optionSource: countries

          - id: localContactNumber
            title:
              en: "Local Contact Number"
              zh_HK: "本地聯絡電話"
            fields:
              - id: hongKongBusinessPhone
                label:
                  en: "HK Business Phone"
                  zh_HK: "香港公司電話"
              - id: hongKongBusinessPhoneExtension
                label:
                  en: "HK Business Phone Extension"
                  zh_HK: "香港電話分機"
              - id: homeTel
                label:
                  en: "Home Telephone"
                  zh_HK: "家居電話"
              - id: hongKongMobilePhone
                label:
                  en: "HK Mobile Phone"
                  zh_HK: "香港手提電話"
              - id: faxNo
                label:
                  en: "Fax Number"
                  zh_HK: "傳真號碼"

          - id: overseasContacts
            title:
              en: "Overseas Contacts"
              zh_HK: "海外聯絡"
            fields:
              - id: overseasCountryCode
                label:
                  en: "Overseas Country Code"
                  zh_HK: "海外國家代碼"
                optionSource: callingCodes
              - id: overseasAreaCode
                label:
                  en: "Overseas Area Code"
                  zh_HK: "海外區號"
              - id: overseasPhoneNumber
                label:
                  en: "Overseas Phone Number"
                  zh_HK: "海外電話號碼"
              - id: overseasPhoneExtension
                label:
                  en: "Overseas Phone Extension"
                  zh_HK: "海外電話分機"

          - id: electronicContacts
            title:
              en: "Electronic Contacts"
              zh_HK: "電子聯絡"
            fields:
              - id: emailAddress
                label:
                  en: "Email Address"
                  zh_HK: "電郵地址"
              - id: smsLanguage
                label:
                  en: "SMS Language"
                  zh_HK: "短訊語言"
                optionSource: smsLanguages

          - id: communicationSettings
            title:
              en: "Communication Settings"
              zh_HK: "通訊設定"
            fields:
              - id: 
                # placeholder for future small settings

          - id: importantNotes
            title:
              en: "Important Notes"
              zh_HK: "重要事項"
            fields:
              - id: importantNotes
                label:
                  en: "Important Notes"
                  zh_HK: "重要事項"

          - id: controlInformation
            title:
              en: "Control Information"
              zh_HK: "控制資料"
            fields:
              - id: applyToAllMemberAccounts
                label:
                  en: "Apply To All Member Accounts"
                  zh_HK: "應用於所有成員帳戶"

      confirmation:
        message:
          en: "Your personal information has been updated."
          zh_HK: "您的個人資料已更新。"
        cancelLabel:
          en: "Cancel"
          zh_HK: "取消"
        submitLabel:
          en: "Submit"
          zh_HK: "提交"
      validations: []
