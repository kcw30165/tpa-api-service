bff-pages:
  pages:
    personalInformation:
      metadata:
        id: personalInformationPage
        version: '1.0'
        title:
          en: Personal Information
          zh_HK: 個人資料
      form:
        id: personalInformationForm
        defaultMode: view
        actions:
        - name: edit
          label:
            en: Edit Information
            zh_HK: 編輯個人資料
        - name: submit
          label:
            en: Submit
            zh_HK: 遞交
        - name: reset
          label:
            en: Reset
            zh_HK: 重設
        - name: cancel
          label:
            en: Cancel
            zh_HK: 取消
        sections:
        - id: addressInformation
          title:
            en: Address Information
            zh_HK: 地址資料
          fields:
          - id: residentialAddressLine1
            displayOrder: 10
            label:
              en: Residential Address Line 1
              zh_HK: 居住地址第一行
            dataType: string
            controlType: text
            maxLength: 40
            placeholder:
              en: Enter residential address line 1
              zh_HK: 請輸入居住地址第一行
            validations:
            - type: required
              code: personalInformation.residentialAddress.required
              message:
                en: Please input a residential address.
                zh_HK: 請輸入居住地址。
            - type: minLength
              value: 5
              when:
                fieldRequired: true
              code: personalInformation.residentialAddress.invalid
              message:
                en: Please input a valid residential address.
                zh_HK: 請輸入有效居住地址。
            - type: blockedAddress
              code: personalInformation.address.poBoxBlocked
              message:
                en: PO Box address will not be accepted, please re-enter your address
                  as our record.
                zh_HK: 郵政信箱恕不接受，請重新輸入住址，以作資料紀錄。
            apimBinding:
              data: addr1
              config: addr1
          - id: residentialAddressLine2
            displayOrder: 20
            label:
              en: Residential Address Line 2
              zh_HK: 居住地址第二行
            dataType: string
            controlType: text
            maxLength: 40
            placeholder:
              en: Enter residential address line 2
              zh_HK: 請輸入居住地址第二行
            apimBinding:
              data: addr2
              config: addr2
          - id: residentialAddressLine3
            displayOrder: 30
            label:
              en: Residential Address Line 3
              zh_HK: 居住地址第三行
            dataType: string
            controlType: text
            maxLength: 40
            placeholder:
              en: Enter residential address line 3
              zh_HK: 請輸入居住地址第三行
            apimBinding:
              data: addr3
              config: addr3
          - id: residentialCountry
            displayOrder: 40
            label:
              en: Country
              zh_HK: 國家
            dataType: string
            controlType: select
            optionSource: countries
            placeholder:
              en: Country
              zh_HK: 國家
            validations:
            - type: required
              code: personalInformation.residentialCountry.required
              message:
                en: Please select a country.
                zh_HK: 請選擇國家。
            apimBinding:
              data: country
              config: country
          - id: mailingAddressSameAsResidential
            displayOrder: 50
            label:
              en: Same as Residential Address
              zh_HK: 與居住地址相同
            dataType: boolean
            controlType: checkbox
            copyWhenChecked:
              fromTo:
                residentialAddressLine1: mailingAddressLine1
                residentialAddressLine2: mailingAddressLine2
                residentialAddressLine3: mailingAddressLine3
                residentialCountry: mailingCountry
            apimBinding:
              # data: ui-check-box-of-same-as-residential-address
              config: ui-check-box-of-same-as-residential-address
          - id: mailingAddressLine1
            displayOrder: 60
            label:
              en: Correspondence Address Line 1
              zh_HK: 通訊地址第一行
            dataType: string
            controlType: text
            maxLength: 40
            placeholder:
              en: Enter correspondence address line 1
              zh_HK: 請輸入通訊地址第一行
            validations:
            - type: minLength
              value: 5
              when:
                fieldRequired: true
              code: personalInformation.mailingAddress.invalid
              message:
                en: Please input a valid correspondence address.
                zh_HK: 請輸入有效通訊地址。
            - type: blockedAddress
              code: personalInformation.address.poBoxBlocked
              message:
                en: PO Box address will not be accepted, please re-enter your address
                  as our record.
                zh_HK: 郵政信箱恕不接受，請重新輸入住址，以作資料紀錄。
            apimBinding:
              data: corr-addr1
              config: corr-addr1
          - id: mailingAddressLine2
            displayOrder: 70
            label:
              en: Correspondence Address Line 2
              zh_HK: 通訊地址第二行
            dataType: string
            controlType: text
            maxLength: 40
            placeholder:
              en: Enter correspondence address line 2
              zh_HK: 請輸入通訊地址第二行
            apimBinding:
              data: corr-addr2
              config: corr-addr2
          - id: mailingAddressLine3
            displayOrder: 80
            label:
              en: Correspondence Address Line 3
              zh_HK: 通訊地址第三行
            dataType: string
            controlType: text
            maxLength: 40
            placeholder:
              en: Enter correspondence address line 3
              zh_HK: 請輸入通訊地址第三行
            apimBinding:
              data: corr-addr3
              config: corr-addr3
          - id: mailingCountry
            displayOrder: 90
            label:
              en: Country
              zh_HK: 國家
            dataType: string
            controlType: select
            optionSource: countries
            placeholder:
              en: Country
              zh_HK: 國家
            apimBinding:
              data: corr-country
              config: corr-country
        - id: localContactNumber
          title:
            en: Phone Numbers
            zh_HK: 聯絡電話
          fields:
          - id: hongKongBusinessPhone
            displayOrder: 10
            label:
              en: Hong Kong Business Telephone Number
              zh_HK: 香港公司電話號碼
            dataType: string
            controlType: tel
            maxLength: 8
            pattern: ^[0-9]*$
            placeholder:
              en: Enter 8-digit phone number
              zh_HK: 請輸入8位數字電話號碼
            validations:
            - type: pattern
              code: personalInformation.businessPhone.invalid
              message:
                en: Please input a valid Hong Kong Business Telephone Number.
                zh_HK: 請輸入有效香港公司電話號碼。
            apimBinding:
              data: business-phone
              config: business-phone
          - id: hongKongBusinessPhoneExtension
            displayOrder: 20
            label:
              en: Ext.
              zh_HK: 內線
            dataType: string
            controlType: text
            maxLength: 4
            pattern: ^[0-9]*$
            placeholder:
              en: Ext.
              zh_HK: 內線
            validations:
            - type: pattern
              code: personalInformation.businessPhoneExtension.invalid
              message:
                en: Please input a valid Ext.
                zh_HK: 請輸入有效內線。
            apimBinding:
              data: business-phone-ext
              config: business-phone-ext
          - id: homeTel
            displayOrder: 30
            label:
              en: Hong Kong Home Telephone Number
              zh_HK: 香港住所電話號碼
            dataType: string
            controlType: tel
            maxLength: 8
            pattern: ^[0-9]*$
            placeholder:
              en: Enter 8-digit home telephone number
              zh_HK: 請輸入8位數字住所電話號碼
            validations:
            - type: pattern
              code: personalInformation.homeTel.invalid
              message:
                en: Please input a valid Hong Kong Home Telephone Number.
                zh_HK: 請輸入有效香港住所電話號碼。
            apimBinding:
              data: home-phone
              config: home-phone
          - id: hongKongMobilePhone
            displayOrder: 40
            label:
              en: Hong Kong Mobile Phone Number
              zh_HK: 香港手提電話號碼
            dataType: string
            controlType: tel
            maxLength: 8
            pattern: ^[4-9][0-9]{7}$
            placeholder:
              en: Enter 8-digit mobile number
              zh_HK: 請輸入8位數字手提電話號碼
            validations:
            - type: pattern
              code: personalInformation.mobilePhone.invalid
              message:
                en: Please input a valid Hong Kong Mobile Telephone Number.
                zh_HK: 請輸入有效香港手提電話號碼。
            apimBinding:
              data: mobile-number
              config: mobile-number
          - id: faxNo
            displayOrder: 50
            label:
              en: Fax No.
              zh_HK: 傳真號碼
            dataType: string
            controlType: text
            pattern: ^[0-9+\- ]*$
            placeholder:
              en: Enter fax number
              zh_HK: 請輸入傳真號碼
            validations:
            - type: pattern
              code: personalInformation.faxNo.invalid
              message:
                en: Please input a valid Fax No.
                zh_HK: 請輸入有效傳真號碼。
            apimBinding:
              data: fax
              config: fax
        - id: overseasContacts
          title:
            en: Overseas Contact
            zh_HK: 海外聯絡電話
          fields:
          - id: overseasCountryCode
            displayOrder: 10
            label:
              en: Country Code
              zh_HK: 國家代碼
            dataType: string
            controlType: select
            optionSource: callingCodes
            pattern: ^[0-9]*$
            placeholder:
              en: Country Code
              zh_HK: 國家號碼
            validations:
            - type: pattern
              value: ^[0-9]*$
              code: personalInformation.overseasCountryCode.invalid
              message:
                en: Please input a valid Country Code.
                zh_HK: 請輸入有效國家號碼。
            apimBinding:
              data: other-phone-country
              config: other-phone-country
          - id: overseasAreaCode
            displayOrder: 20
            label:
              en: Area Code
              zh_HK: 區域代碼
            dataType: string
            controlType: text
            pattern: ^[0-9]*$
            placeholder:
              en: Area Code
              zh_HK: 區域號碼
            validations:
            - type: pattern
              code: personalInformation.overseasAreaCode.invalid
              message:
                en: Please input a valid Area Code.
                zh_HK: 請輸入有效區域號碼。
            apimBinding:
              data: other-phone-area
              config: other-phone-area
          - id: overseasPhoneNumber
            displayOrder: 30
            label:
              en: Phone Number
              zh_HK: 電話號碼
            dataType: string
            controlType: tel
            maxLength: 17
            pattern: ^[0-9]*$
            placeholder:
              en: Phone Number
              zh_HK: 電話號碼
            validations:
            - type: pattern
              code: personalInformation.overseasPhoneNumber.invalid
              message:
                en: Please input a valid Overseas Phone Number.
                zh_HK: 請輸入有效海外電話號碼。
            apimBinding:
              data: other-phone
              config: other-phone
          - id: overseasPhoneExtension
            displayOrder: 40
            label:
              en: Overseas Phone Extension
              zh_HK: 海外電話分機
            dataType: string
            controlType: text
            maxLength: 4
            pattern: ^[0-9]*$
            placeholder:
              en: Ext.
              zh_HK: 內線
            apimBinding:
              data: other-phone-ext
              config: other-phone-ext
        - id: electronicContacts
          title:
            en: Email Contact
            zh_HK: 聯絡電郵
          fields:
          - id: emailAddress
            displayOrder: 10
            label:
              en: Email Address
              zh_HK: 電郵地址
            dataType: string
            controlType: email
            maxLength: 120
            patter: ^[^\s@]+@[^\s@]+\.[^\s@]+$
            placeholder:
              en: Enter email address
              zh_HK: 請輸入電郵地址
            validations:
            - type: required
              code: personalInformation.email.required
              message:
                en: Please provide a valid email address.
                zh_HK: 請輸入有效電郵地址。
            - type: email
              code: personalInformation.email.invalid
              message:
                en: Please provide a valid email address.
                zh_HK: 請輸入有效電郵地址。
            apimBinding:
              data: email
              config: email
        - id: communicationSettings
          title:
            en: Communication Settings
            zh_HK: 通訊設定
          fields:
          - id: smsLanguage
            displayOrder: 10
            label:
              en: Language Selection of SMS (Optional)
              zh_HK: 短訊語言選擇 (可選)
            dataType: string
            controlType: radio
            optionSource: smsLanguages
            apimBinding:
              data: sms-language
              config: sms-language
        - id: importantNotes
          title:
            en: Important Notes
            zh_HK: 重要事項
          fields:
          - id: importantNotes
            displayOrder: 10
            label:
              en: Important Notes
              zh_HK: 重要事項
            dataType: array
            controlType: noteList
            apimBinding:
              # data: ui-important-notes-section
              config: ui-important-notes-section
        - id: controlInformation
          title:
            en: Control Information
            zh_HK: 控制資料
          fields:
          - id: applyToAllMemberAccounts
            displayOrder: 10
            label:
              en: Apply update to all member accounts under the plan
              zh_HK: 將更新套用至計劃下所有成員戶口
            dataType: boolean
            controlType: checkbox
            apimBinding:
              # data: ui-check-box-apply-all-member
              config: ui-check-box-apply-all-member
      confirmation:
        enabled: true
        title:
          en: Confirm Information Update
          zh_HK: 確認個人資料更改
        reviewMessage:
          en: Please review the changes you've made to your information before confirming.
          zh_HK: 請在確認前檢查已更改的個人資料。
        beforeLabel:
          en: Before Changes
          zh_HK: 變更前
        afterLabel:
          en: After Changes
          zh_HK: 變更後
        securityVerification:
          label:
            en: Security Verification
            zh_HK: 安全認證
          instruction:
            en: Please enter your password to confirm these changes
            zh_HK: 請輸入您的密碼以確認以上變更
          passwordField:
            name: password
            dataType: string
            controlType: password
            required: true
            minLength: 8
            maxLength: 16
            validations:
            - type: required
            - type: minLength
            - type: maxLength
            - type: noSpaces
        actions:
          cancel:
            enabled: true
          confirmSubmit:
            enabled: true
      validations:
      - id: address.atLeastOneRequired
        type: groupRequirement
        severity: error
        when:
          operator: allGroupsEmpty
          groups:
          - id: residentialAddress
            existsWhen:
              field: residentialAddressLine1
              operator: notBlank
          - id: mailingAddress
            existsWhen:
              field: mailingAddressLine1
              operator: notBlank
        then:
          operator: fail
          targets:
          - residentialAddressLine1
          - mailingAddressLine1
        code: personalInformation.address.atLeastOneRequired
        message:
          en: Please input a residential address or correspondence address.
          zh_HK: 請輸入居住地址或通訊地址。
      - id: residentialAddress.completeWhenStarted
        type: conditionalRequired
        severity: error
        when:
          operator: notBlank
          field: residentialAddressLine1
        then:
          operator: allRequired
          fields:
          - residentialAddressLine1
          - residentialCountry
          targets:
          - residentialAddressLine1
          - residentialCountry
        code: personalInformation.residentialAddress.incomplete
        message:
          en: Please input a residential address.
          zh_HK: 請輸入居住地址。
      - id: mailingAddress.completeWhenStarted
        type: conditionalRequired
        severity: error
        when:
          operator: notBlank
          field: mailingAddressLine1
        then:
          operator: allRequired
          fields:
          - mailingAddressLine1
          - mailingCountry
          targets:
          - mailingAddressLine1
          - mailingCountry
        code: personalInformation.mailingAddress.incomplete
        message:
          en: Please input a correspondence address.
          zh_HK: 請輸入通訊地址。
      - id: businessPhone.requiredWhenExtensionPresent
        type: conditionalRequired
        severity: error
        when:
          operator: notBlank
          field: hongKongBusinessPhoneExtension
        then:
          operator: required
          field: hongKongBusinessPhone
          targets:
          - hongKongBusinessPhone
        code: personalInformation.businessPhone.requiredWhenExtensionPresent
        message:
          en: Please input a valid Hong Kong Business Phone Number.
          zh_HK: 請輸入有效香港公司電話號碼。
      - id: overseasCountryCode.requiredWhenPhonePresent
        type: conditionalRequired
        severity: error
        when:
          operator: notBlank
          field: overseasPhoneNumber
        then:
          operator: required
          field: overseasCountryCode
          targets:
          - overseasCountryCode
        code: personalInformation.overseasCountryCode.requiredWhenPhonePresent
        message:
          en: Please input a valid Country Code.
          zh_HK: 請輸入有效國家號碼。
      - id: overseasPhone.requiredWhenCodePresent
        type: conditionalRequired
        severity: error
        when:
          operator: any
          conditions:
          - field: overseasCountryCode
            operator: notBlank
          - field: overseasAreaCode
            operator: notBlank
        then:
          operator: required
          field: overseasPhoneNumber
          targets:
          - overseasPhoneNumber
        code: personalInformation.overseasPhoneNumber.requiredWhenCodePresent
        message:
          en: Please input a valid Overseas Phone Number.
          zh_HK: 請輸入有效海外電話號碼。
      - id: aeoiReminder.whenResidentialCountryChanged
        type: conditionalWarning
        severity: warning
        when:
          operator: changed
          field: residentialCountry
          compareWith: originalValue
        then:
          operator: showMessage
          targets:
          - residentialCountry
        code: personalInformation.aeoiReminder
        message:
          en: Please remember to submit your AEOI Self-Certificate by clicking Self
            Certification for Tax Residency function.
          zh_HK: 請記得點選『稅務居民證明』功能，以提交您的 AEOI 證明。
