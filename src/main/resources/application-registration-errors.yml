workflow-error-contract:
  navigation:
    VERIFY_OTP:
      page-id: registration-otp-verification
    USERNAME_CHECK:
      page-id: registration-username-check
    SELECT_TRUST:
      page-id: registration-trust-selection
    PASSWORD_SETUP:
      page-id: registration-password-setup
    RETURN_TO_LOGIN:
      page-id: login
    RESTART_FLOW:
      page-id: registration-start
  errors:
    - code: err.registration.authFlow.invalid
      type: BUSINESS
      severity: ERROR
      source: SERVER
      targets:
        - PAGE
      next-step: RESTART_FLOW
    - code: err.registration.csrf.invalid
      type: BUSINESS
      severity: ERROR
      source: SERVER
      targets:
        - PAGE
      next-step: NONE
    - code: err.registration.origin.invalid
      type: BUSINESS
      severity: ERROR
      source: SERVER
      targets:
        - PAGE
      next-step: NONE
    - code: err.registration.state.invalid
      type: BUSINESS
      severity: ERROR
      source: SERVER
      targets:
        - PAGE
      next-step: NONE
    - code: err.registration.start.request.invalid
      type: FORM
      severity: ERROR
      source: SERVER
      targets:
        - PAGE
      next-step: RESTART_FLOW
    - code: err.registration.start.rateLimited
      type: BUSINESS
      severity: ERROR
      source: SERVER
      targets:
        - PAGE
      next-step: RESTART_FLOW
    - code: err.registration.start.verificationFailed
      type: BUSINESS
      severity: ERROR
      source: SERVER
      targets:
        - PAGE
      next-step: RESTART_FLOW
    - code: err.registration.otp.required
      type: FIELD
      severity: ERROR
      source: SERVER
      targets:
        - otpCode
      next-step: VERIFY_OTP
